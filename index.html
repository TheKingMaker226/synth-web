<style>
:root {
  --bg: #0b0e14;
  --bg2: #10141c;
  --bg3: #161b25;
  --line: #222a37;
  --text: #d1d4dc;
  --muted: #7d8595;
  --accent: #00e5ff;
  --accent2: #ff2bd6;
  --blue: #2962ff;
  --green: #089981;
  --green2: #26c6a6;
  --red: #f23645;
  --orange: #ff9800;
  --panel-w: 380px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--bg3); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: #3a4558; background: #1c2330; }
button.primary { background: linear-gradient(135deg, #0077ff, #00c2e0); border: none; color: #fff; font-weight: 600; }
button.danger { color: #ff8a95; }
select, input[type=number], input[type=text] { background: var(--bg3); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.muted { color: var(--muted); }
.up { color: var(--green2); }
.down { color: #ff5d6c; }

#top { height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--bg2); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .3px; }
.brand img { width: 26px; height: 26px; border-radius: 6px; }
.brand span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
#symbol { max-width: 230px; font-weight: 600; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: none; border-radius: 0; background: transparent; padding: 5px 9px; color: var(--muted); }
.seg button.on { background: #1e2a44; color: #fff; }
.quote { display: flex; align-items: baseline; gap: 8px; min-width: 190px; }
#price { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.countdown { font-variant-numeric: tabular-nums; }
.countdown b { font-size: 15px; color: var(--accent); }
.spacer { flex: 1; }
.tb { background: transparent; }
.status { font-size: 16px; }
.status.online { color: var(--green2); }
.status.connecting { color: var(--orange); }
.status.offline { color: var(--red); }

#main { display: flex; height: calc(100% - 48px); }
#tools { width: 44px; border-right: 1px solid var(--line); background: var(--bg2); display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 3px; }
#tools button { width: 34px; height: 32px; padding: 0; border: none; background: transparent; font-size: 15px; color: #b8bdc8; border-radius: 6px; }
#tools button:hover { background: var(--bg3); }
#tools button.on { background: #1e2a44; color: var(--accent); }
#tools .sep { width: 24px; border-top: 1px solid var(--line); margin: 6px 0; }

#chartWrap { position: relative; flex: 1; min-width: 200px; }
#chart { position: absolute; inset: 0; }
#overlay { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3; }
#chartWrap.drawing { cursor: crosshair; }
#legend { position: absolute; left: 8px; top: 6px; z-index: 4; pointer-events: none; font-size: 12px; line-height: 1.55; text-shadow: 0 0 4px #000; }
#legend .t { font-weight: 600; font-size: 13px; }
#legend span { margin-right: 8px; font-variant-numeric: tabular-nums; }
#selbar { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 5; background: var(--bg3); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; display: flex; gap: 8px; align-items: center; box-shadow: 0 4px 18px #0008; }
#selColors { display: flex; gap: 4px; }
#selColors i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; cursor: pointer; border: 2px solid transparent; }
#selColors i:hover { border-color: #fff; }
#chartBtns { position: absolute; right: 80px; bottom: 36px; z-index: 4; display: flex; gap: 4px; }
#chartBtns button { padding: 3px 8px; font-size: 11px; background: #161b25cc; }
#chartBtns button.on { color: var(--accent); border-color: var(--accent); }
#replayBar { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 6; background: var(--bg3); border: 1px solid #2c3b58; border-radius: 10px; padding: 6px 10px; display: flex; gap: 6px; align-items: center; box-shadow: 0 6px 24px #000a; }
#replayBar b { color: var(--accent); margin-right: 4px; }
#replayBar > * { white-space: nowrap; }
#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 7; background: #0b0e14aa; font-size: 15px; }

#resizer { width: 5px; cursor: col-resize; background: var(--line); }
#resizer:hover { background: var(--blue); }
#panel { width: var(--panel-w); background: var(--bg2); display: flex; flex-direction: column; min-width: 280px; }
body.nopanel #panel, body.nopanel #resizer { display: none; }
.tabs { display: flex; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { flex: 1; white-space: nowrap; font-size: 12px; border: none; border-radius: 0; background: transparent; padding: 9px 2px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.on { color: #fff; border-bottom-color: var(--accent); }
.tab { display: none; overflow-y: auto; padding: 10px; flex: 1; }
.tab.on { display: block; }
.card { background: var(--bg3); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.card h3 { margin: 0 0 6px; font-size: 13px; color: #fff; display: flex; align-items: center; gap: 6px; }
.card p { margin: 4px 0; }
.card .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.card .row span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.pill.buy { background: #08998133; color: var(--green2); }
.pill.sell { background: #f2364533; color: #ff6b78; }
.pill.neutral { background: #ffffff14; color: var(--muted); }
.note { color: var(--muted); font-size: 12px; }
.sig { border-left: 3px solid var(--green); padding-left: 8px; margin: 8px 0; }
.sig.sell { border-left-color: var(--red); }
table.t { width: 100%; border-collapse: collapse; font-size: 12px; }
table.t th, table.t td { padding: 4px 3px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t th { color: var(--muted); font-weight: 500; }
.verdict { border-radius: 6px; padding: 5px 8px; margin-top: 6px; font-size: 12px; }
.verdict.none { background: #ffffff0d; color: #aab; }
.verdict.weak { background: #ff980022; color: #ffc163; }
.verdict.strong { background: #00e5ff1f; color: var(--accent); }
.verdict.na { background: #ffffff08; color: var(--muted); }
.flex { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mt { margin-top: 8px; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.progress div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .2s; }
label.sw { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
.guide h4 { margin: 12px 0 4px; color: #fff; }
.guide kbd { background: #222a37; border-radius: 4px; padding: 0 5px; font-size: 11px; }
.guide code { color: var(--accent); }

.menu { position: fixed; z-index: 50; background: var(--bg3); border: 1px solid var(--line); border-radius: 10px; padding: 6px; min-width: 250px; box-shadow: 0 10px 30px #000b; }
.menu label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.menu label:hover { background: #1e2533; }
.menu .hint { color: var(--muted); font-size: 11px; margin-left: auto; }
.menu h5 { margin: 6px 8px 2px; color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }

#alarm { position: fixed; inset: 0; z-index: 100; background: #000c; display: flex; align-items: center; justify-content: center; }
#alarm .box { background: var(--bg3); border: 1px solid var(--accent); border-radius: 16px; padding: 28px 36px; text-align: center; max-width: 420px; box-shadow: 0 0 60px #00e5ff44; }
#alarm .big { font-size: 48px; animation: shake .5s infinite; }
#alarm button { margin-top: 14px; font-size: 16px; padding: 10px 24px; background: var(--red); border: none; color: #fff; }
@keyframes shake { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1e2a44; border: 1px solid #2c3b58; padding: 8px 16px; border-radius: 8px; z-index: 90; box-shadow: 0 6px 20px #0009; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: #2a3242; border-radius: 5px; }
::-webkit-scrollbar-track { background: transparent; }

#imgModal { position: fixed; inset: 0; z-index: 95; background: #000d; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: zoom-out; }
#imgModal img { max-width: 94vw; max-height: 88vh; border: 1px solid var(--line); border-radius: 8px; }
.snap { display: grid; grid-template-columns: 112px 1fr; gap: 8px; }
.snap img { width: 112px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; }
.snap .calls { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.call { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: #ffffff10; }
.call.ok { background: #08998133; color: var(--green2); }
.call.ko { background: #f2364533; color: #ff8a95; }
.call.wait { background: #ff980022; color: #ffc163; }
.guess.up { color: var(--green2); } .guess.down { color: #ff6b78; }
#tabs-wrap {}

/* ---------- Tablette et téléphone ---------- */
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); height: 100%; }
#top { overflow-x: auto; scrollbar-width: none; }
#top::-webkit-scrollbar { display: none; }
#top > * { flex-shrink: 0; }
@media (max-width: 1180px) {
  .brand span, .lbl { display: none; }
  .quote { min-width: 0; }
  #change { display: none; }
}
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  #main { flex-direction: column; }
  #chartWrap { flex: 1 1 auto; min-height: 260px; }
  #resizer { display: none; }
  #panel { width: 100% !important; height: 44%; min-width: 0; border-top: 1px solid var(--line); flex: 0 0 auto; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: 0 0 auto; padding: 10px 12px; font-size: 13px; }
  #chartBtns { right: 70px; bottom: 30px; }
  #main { position: relative; }
  #tools { position: absolute; z-index: 8; left: 0; top: 0; width: 40px; max-height: 56%; overflow-y: auto; background: #10141ce6; border-radius: 0 0 8px 0; border-right: 1px solid var(--line); }
  #tools button { width: 32px; height: 30px; }
  #chartWrap { margin-left: 40px; }
}
@media (max-width: 700px) {
  #top { height: 44px; gap: 6px; padding: 0 6px; }
  #main { height: calc(100% - 44px); }
  #symbol { max-width: 150px; font-size: 12px; }
  .seg button { padding: 5px 7px; font-size: 12px; }
  #price { font-size: 14px; }
  .brand img { width: 22px; height: 22px; }
  #tools { width: 36px; }
  #tools button { width: 30px; height: 30px; font-size: 14px; }
  #chartWrap { margin-left: 36px; }
  #legend { font-size: 10px; line-height: 1.4; }
  #legend .t { font-size: 11px; }
  #legend div:nth-child(3) { display: none; }
  #replayBar { left: 6px; right: 6px; transform: none; bottom: 28px; flex-wrap: wrap; justify-content: center; }
  #replayBar #rpInfo { width: 100%; text-align: center; }
  .menu { left: 8px !important; right: 8px; min-width: 0; }
  #selbar { top: auto; bottom: 34px; }
  .card { padding: 9px 10px; }
  #toast { left: 8px; right: 8px; transform: none; text-align: center; }
}
@media (hover: none) {
  button { min-height: 32px; }
}

</style>

  <div class="card"><h3>\u{1F4F8} Suivi des pr\xE9dictions</h3>
    <p>Bouton \u{1F4F8} Capturer (en haut) ou onglet Suivi : l'application fige sa pr\xE9diction sur la derni\xE8re bougie cl\xF4tur\xE9e (formes similaires, tendance EMA, RSI extr\xEAme, configurations) avec votre propre avis et une image du graphique.</p>
    <p>Ensuite elle v\xE9rifie toute seule : le prix a-t-il d'abord mont\xE9 de 1 ATR (\u2191) ou baiss\xE9 de 1 ATR (\u2193) dans les 50 bougies ? Chaque avis re\xE7oit \u2713 ou \u2717, et le tableau des scores compare tout le monde \xE0 pile ou face (50 %).</p>
    <p>\xAB Voir sur le graphique \xBB remet la capture \xE0 sa place : la zone bleue est ce qui \xE9tait pr\xE9vu, les lignes \xB11 ATR les deux issues possibles, les bougies ce qui s'est r\xE9ellement pass\xE9. En Replay, on peut capturer des instants du pass\xE9 et avoir le r\xE9sultat tout de suite.</p></div>
  <div class="card"><h3>\u23EA Replay</h3>
    <p>Cliquez sur \u23EA Replay, puis \u{1F4CD} D\xE9part et cliquez sur une bougie du graphique. Avancez avec \u23ED ou <kbd>\u2192</kbd>, reculez avec \u23EE ou <kbd>\u2190</kbd>, \u25B6 pour la lecture automatique. Les analyses ne voient que les bougies d\xE9j\xE0 r\xE9v\xE9l\xE9es : entra\xEEnez-vous \xE0 d\xE9cider avant de voir la suite.</p></div>
  <div class="card"><h3>\u{1F4A1} \xC0 garder en t\xEAte</h3>
    <p>Les indices synth\xE9tiques sont g\xE9n\xE9r\xE9s par un algorithme al\xE9atoire. Le Labo sert \xE0 v\xE9rifier, chiffres \xE0 l'appui, si un sch\xE9ma revient vraiment plus souvent que par hasard. Une configuration ne vaut que si elle reste positive sur beaucoup de trades et sur plusieurs p\xE9riodes.</p></div>
